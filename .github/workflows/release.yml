name: Release

# Publishing from CI rather than a laptop, for two reasons: the token lives in
# one place with one scope, and npm records provenance — a public, verifiable
# link from the tarball back to this workflow and this commit. A publish from a
# desktop cannot produce that, whoever is logged in.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same gates CI runs on every push. A release that skipped them
      # would be the one build nobody checked.
      - run: npm run check
      - run: npm run check:manifest
      - run: npm run check:provenance
      - run: npm test
      - run: npm run build:check

      - name: The tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - name: Publish (dry run)
        run: npm publish --access public --provenance --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required to publish." >&2
            exit 1
          fi
          npm publish --access public --provenance
