name: Release

# Publishing from CI rather than a laptop, for two reasons: there is no
# long-lived credential anywhere, and npm records provenance — a public,
# verifiable link from the tarball back to this workflow and this commit. A
# publish from a desktop cannot produce that, whoever is logged in.
#
# Authentication is npm trusted publishing: the registry is configured to trust
# this repository and this workflow file, and the job proves who it is with the
# OIDC token GitHub mints for it (`id-token: write`). Renaming this file or
# moving the job to another repository breaks publishing until the trust is
# re-registered — which is the point.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same gates CI runs on every push. A release that skipped them
      # would be the one build nobody checked.
      - run: npm run check
      - run: npm run check:manifest
      - run: npm run check:provenance
      - run: npm test
      - run: npm run build:check

      - name: The tag and package.json must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      # Trusted publishing needs npm 11.5.1 or newer; the Node 20 image ships
      # npm 10, which would fail with an authentication error that reads like a
      # misconfigured trust relationship rather than an old client.
      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish (dry run)
        run: npm publish --access public --provenance --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: npm publish --access public --provenance
